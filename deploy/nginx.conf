# Một domain duy nhất cho cả web lẫn API:
#   /api/*, /up        -> Laravel (PHP-FPM)
#   /storage/*         -> ảnh admin upload (storage/app/public)
#   mọi đường dẫn khác -> Next.js storefront (node, cổng 3000 nội bộ)
# Chỉ gửi "Connection: upgrade" khi trình duyệt thật sự xin WebSocket; gửi cho mọi request làm
# kết nối keep-alive tới Next.js bị treo (prefetch không bao giờ trả về).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 0.0.0.0:${PORT};
    server_name _;

    root /var/www/public;
    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 20m;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /storage/ {
        try_files $uri =404;
        expires 7d;
    }

    # favicon/robots nằm trong public/ của Laravel
    location ~ ^/(favicon\.ico|robots\.txt)$ {
        try_files $uri =404;
        access_log off;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
